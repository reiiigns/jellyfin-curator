<script>
const JELLYFIN_URL = "http://YOUR_TAILSCALE_IP:8097";
const API_KEY = "YOUR_JELLYFIN_API_KEY";
const OPENROUTER_API_KEY = "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";

const input = document.getElementById("input");
const output = document.getElementById("output");

input.addEventListener("keydown", async (e) => {
    if (e.key === "Enter") {
        const prompt = input.value;
        input.value = "";

        log(`> ${prompt}`);
        log("Thinking...");

        try {
            const filters = await parseWithAI(prompt);
            log("Parsed:");
            log(JSON.stringify(filters, null, 2));

            const items = await fetchItems(filters);
            log(`Found ${items.length} items`);

            if (!items.length) {
                log("No results found.");
                return;
            }

            await createPlaylist(prompt, items);
            log(`Playlist "${prompt}" created.`);
        } catch (err) {
            log("Error: " + err.message);
        }
    }
});

function log(text) {
    output.innerText += text + "\n";
}

async function parseWithAI(prompt) {
    const res = await fetch("https://openrouter.ai/api/v1/chat/completions", {
        method: "POST",
        headers: {
            "Authorization": `Bearer ${OPENROUTER_API_KEY}`,
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            model: "mistralai/mistral-7b-instruct",
            messages: [
                {
                    role: "system",
                    content: `
Convert user request into JSON with:
genre, subgenre, startYear, endYear, mood

Return ONLY JSON.
`
                },
                {
                    role: "user",
                    content: prompt
                }
            ]
        })
    });

    const data = await res.json();
    const text = data.choices[0].message.content;

    try {
        return JSON.parse(text);
    } catch {
        throw new Error("AI parsing failed");
    }
}

async function fetchItems(filters) {
    const url = `${JELLYFIN_URL}/Items?IncludeItemTypes=Audio&Recursive=true`;

    const res = await fetch(url, {
        headers: {
            "X-Emby-Token": API_KEY
        }
    });

    const data = await res.json();
    let items = data.Items;

    if (filters.genre) {
        items = items.filter(i =>
            i.Genres?.includes(filters.genre)
        );
    }

    if (filters.startYear) {
        items = items.filter(i =>
            i.ProductionYear >= filters.startYear &&
            i.ProductionYear <= filters.endYear
        );
    }

    return items.slice(0, 50);
}

async function createPlaylist(name, items) {
    const ids = items.map(i => i.Id).join(",");

    const url = `${JELLYFIN_URL}/Playlists?Name=${encodeURIComponent(name)}&Ids=${ids}`;

    await fetch(url, {
        method: "POST",
        headers: {
            "X-Emby-Token": API_KEY
        }
    });
}
</script>
